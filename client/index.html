    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <style>
      html, body, #root { min-height: 100%; margin: 0; background: #f7f8fa; }
      body { min-height: 100dvh; }
      .fazaah-boot-screen {
        position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 14px; padding: 24px;
        background: #f7f8fa; color: #182d53; font: 600 14px/1.5 'Tajawal', 'Noto Sans Arabic', sans-serif;
      }
      .fazaah-boot-screen img { width: 88px; height: 107px; object-fit: contain; }
      .fazaah-boot-dots { display: flex; align-items: center; gap: 8px; }
      .fazaah-boot-dots i {
        width: 7px; height: 7px; border-radius: 999px; background: #182d53;
        animation: fazaah-boot-pulse 900ms ease-in-out infinite alternate;
      }
      .fazaah-boot-dots i:nth-child(2) { background: #f0b046; animation-delay: 180ms; }
      .fazaah-boot-dots i:nth-child(3) { animation-delay: 360ms; }
      @keyframes fazaah-boot-pulse { to { opacity: .3; transform: translateY(-3px); } }
      @media (prefers-reduced-motion: reduce) {
        .fazaah-boot-dots i { animation: none; }
      }
      [class*="manus-badge"], [id*="manus-badge"], [class*="made-with-manus"], [id*="made-with-manus"], a[href*="manus.im"], a[href*="manus.space"] {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
      }
    </style>
    <script>
      (function removeManusBranding() {
        function purge() {
          const selectors = ['[class*="manus-badge"]', '[id*="manus-badge"]', '[class*="made-with-manus"]', '[id*="made-with-manus"]', 'a[href*="manus.im"]', 'a[href*="manus.space"]'];
          document.querySelectorAll(selectors.join(',')).forEach(el => el.remove());
        }
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', purge);
        } else {
          purge();
        }
        new MutationObserver(purge).observe(document.documentElement, { childList: true, subtree: true });
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div class="fazaah-boot-screen" role="status" aria-live="polite" dir="rtl">
        <img src="/assets/fazaah-logo.png" width="88" height="107" alt="فزعة" />
        <div class="fazaah-boot-dots" aria-hidden="true"><i></i><i></i><i></i></div>
        <span>جارٍ تجهيز فزعة...</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
