    <style>
      [class*="manus-badge"], [id*="manus-badge"], [class*="made-with-manus"], [id*="made-with-manus"], a[href*="manus.im"], a[href*="manus.space"] {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
      }
    </style>
    <script>
      (function removeManusBranding() {
        function purge() {
          const selectors = ['[class*="manus-badge"]', '[id*="manus-badge"]', '[class*="made-with-manus"]', '[id*="made-with-manus"]', 'a[href*="manus.im"]', 'a[href*="manus.space"]'];
          document.querySelectorAll(selectors.join(',')).forEach(el => el.remove());
        }
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', purge);
        } else {
          purge();
        }
        new MutationObserver(purge).observe(document.documentElement, { childList: true, subtree: true });
      })();
    </script>
